<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>GeeCompare app icon</title>
  <defs>
    <linearGradient id="gc-band" x1="0" x2="1" y1="0" y2="0">
      <stop offset=".18" stop-color="#e39a4c"/>
      <stop offset=".82" stop-color="#4fb3b8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="#1e1c19"/>
  <rect x="26" y="26" width="972" height="972" rx="212" fill="none" stroke="#2a2723" stroke-width="4"/>
